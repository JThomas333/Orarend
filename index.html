<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Órarend</title>
  <style>
    body{
      background-color: bisque;
    }
   table{
    margin: auto;
    width: 300px;
    height: 500px;
    background-color: lightgoldenrodyellow;
    font-size: 20px;
   }

    th,
    td {
      border: 2px solid black;
      padding: 10px;
      text-align: center;
    }

    h1 {
      text-align: center;
      font-size: 30px;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-top: 30px;
      gap: 20px;
      text-align: center;
      
    }

    #elso,
    #mas,
    #harm{
      background-color: white;
    border: 2px solid black;
    padding: 10px;
    width: 200px;
    }
    button {
      margin-top: 10px;
    }
    input {
      margin-top: 5px;
    }


  </style>
</head>

<body onload="timetable()">
  <h1>Órarend szerkesztése</h1>

  <table id="orarend">
    <tr>
      <th>Hétfő</th>
      <th>Kedd</th>
      <th>Szerda</th>
      <th>Csütörtök</th>
      <th>Péntek</th>
      <th>Óra</th>
    </tr>
    
  </table>
<div class="container">
  <div id="elso">
    <h3>Óra törlése</h3>
    <input type="text" id="deleteNap" placeholder="Nap (pl:. Kedd)" />
    <br>
    <input type="number" id="deleteOra" placeholder="Óraszám (1-9)" />
    <br>
    <button onclick="torol()">Törlés</button>
  </div>
  <div id="mas">
    <h3>Nap óráinak törlése</h3>
    <input type="text" id="deleteNapTeljes" placeholder="Nap (pl:. Kedd)">
    <br>
    <button onclick="torolNap()">Teljes nap törlése</button>
  </div>
  <div id="harm">
    <h3>Óra szerkesztése</h3>
    <input type="text" id="editNap" placeholder="Nap (pl. Kedd)" />
    <br>
    <input type="number" id="editOra" placeholder="Óraszám (1-9)" />
    <br>
    <input type="text" id="editTantargy" placeholder="Tantárgy" />
    <br>
    <button onclick="szerkeszt()">Szerkesztés</button>
  </div>
</div>
  <script>
    let adat = [];

    async function timetable() {
      const napok = ["Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek"];
      const response = await fetch("http://localhost:3000/timetable");
      adat = await response.json();

      const table = document.getElementById("orarend");
      while (table.rows.length > 1) table.deleteRow(1);

      for (let i = 1; i <= 9; i++) {
        const tr = document.createElement("tr");
        for (let j of napok) {
          const td = document.createElement("td");
          const tanora = adat.find(d => d.day == j);
          let value = "";
          if (tanora && tanora[`ora${i}`]) {
            value = tanora[`ora${i}`];
          }
          const span = document.createElement("span");
          span.textContent = value;
          td.appendChild(span);
          tr.appendChild(td);
        }

        const oraCell = document.createElement("td");
        oraCell.textContent = i;
        tr.appendChild(oraCell);

        table.appendChild(tr);
      }
    }

    async function torol() {
      const nap = document.getElementById("deleteNap").value;
      const oraSzam = parseInt(document.getElementById("deleteOra").value);
      if (!nap || isNaN(oraSzam) || oraSzam < 1 || oraSzam > 9) {
        alert("Rossz adat!");
        return;
      }

      const tanora = adat.find(d => d.day == nap);
      if (!tanora) {
        alert("Rossz lekérés!");
        return;
      }

      tanora[`ora${oraSzam}`] = "";

      await fetch(`http://localhost:3000/timetable/${tanora.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(tanora)
      });

      alert(`${nap} ${oraSzam}. óra törölve!`);
      timetable();
    }

    async function torolNap() {
      const nap = document.getElementById("deleteNapTeljes").value;

      if (!nap) {
        alert("Rossz lekérés!");
        return;
      }

      const napAdat = adat.find(d => d.day == nap);
      if (!napAdat) {
        alert("Rossz adat.");
        return;
      }

      await fetch(`http://localhost:3000/timetable/${napAdat.id}`, {
        method: "DELETE"
      });

      alert(`${nap} törölve!`);
      timetable();
    }

    async function szerkeszt() {
      const nap = document.getElementById("editNap").value;
      const oraSzam = parseInt(document.getElementById("editOra").value);
      const tantargy = document.getElementById("editTantargy").value;

      if (!nap || isNaN(oraSzam) || oraSzam < 1 || oraSzam > 9 || !tantargy) {
        alert("Rossz adat!");
        return;
      }

      const tanora = adat.find(d => d.day == nap);
      if (!tanora) {
        alert("Rossz lekérés!");
        return;
      }

      tanora[`ora${oraSzam}`] = tantargy;

      await fetch(`http://localhost:3000/timetable/${tanora.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(tanora)
      });

      alert(`${nap} ${oraSzam}. módosítva!`);
      timetable();
    }
  </script>
</body>

</html>
